services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: symfony-php
    volumes:
      - ./:/var/www/html
    networks:
      - symfony
    environment:
      - APP_ENV=dev
      - SYMFONY_ENV=dev
    ports:
      - "9000:9000"  # PHP-FPM port

  nginx:
    image: nginx:alpine
    container_name: symfony-nginx
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"  # Nginx port
    networks:
      - symfony

  mysql:
    image: mysql:5.7
    container_name: symfony-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: symfony
      MYSQL_USER: symfonyuser
      MYSQL_PASSWORD: symfonypass
    volumes:
      - ./docker/mysql:/docker-entrypoint-initdb.d
    networks:
      - symfony
    ports:
      - "3306:3306"  # MySQL port

networks:
  symfony:
    driver: bridge

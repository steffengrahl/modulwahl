name: Symfony CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ PHP Setup mit Xdebug für Coverage
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          extensions: mbstring, intl, xml
          coverage: xdebug

      # 3️⃣ Composer Cache
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # 4️⃣ Install Dependencies
      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      # 5️⃣ Security Check
      - name: Security Check
        run: composer audit

      # 6️⃣ Linting / Static Analysis
      - name: PHPStan Analysis
        run: vendor/bin/phpstan analyse -c phpstan.neon --memory-limit=2G

      # 7️⃣ PHPUnit Tests mit Coverage
      - name: Run PHPUnit with Coverage
        run: |
          mkdir -p tests/_output
          vendor/bin/phpunit --colors=always --coverage-html tests/_output/coverage-html --log-junit tests/_output/junit.xml

      # 8️⃣ Upload PHPUnit HTML Coverage Report
      - name: Upload PHPUnit Coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage-html
          path: tests/_output/coverage-html

      # 9️⃣ Upload PHPUnit JUnit XML (optional für CI-Integration)
      - name: Upload PHPUnit JUnit XML
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-junit
          path: tests/_output/junit.xml
